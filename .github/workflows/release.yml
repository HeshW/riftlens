# Builds the Windows installer and publishes a GitHub Release when a version
# tag (v0.2.0, v0.3.0, ...) is pushed. The release includes latest.json, which
# the installed app reads to auto-update.
#
# Needs the repo secret TAURI_SIGNING_PRIVATE_KEY (the contents of
# ~/.tauri/riftlens.key) so updates are signed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: RiftLens v__VERSION__
          releaseBody: "Download the setup file below to install RiftLens. Installed copies update themselves."
          releaseDraft: false
          prerelease: false
